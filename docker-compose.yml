services:
  beeps-backend:
    build: ./backend
    container_name: beeps-backend
    expose:
      - ${PORT}
    environment:
      PORT: ${PORT}
      TTS_API_KEY: ${TTS_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      YANDEX_TTS_GRPC_HOST: ${YANDEX_TTS_GRPC_HOST}
      TIMELINE_LOG: ${TIMELINE_LOG}
      PERPLEXITY_LOG: ${PERPLEXITY_LOG}
    restart: unless-stopped
    init: true
    networks:
      - proxy

  beeps-frontend:
    build: ./frontend
    container_name: beeps-frontend
    expose:
      - 80
    depends_on:
      - beeps-backend
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
